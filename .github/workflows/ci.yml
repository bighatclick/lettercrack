name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Daily determinism across device timezones (F5)
        run: |
          for tz in America/Los_Angeles America/New_York Europe/London Asia/Kolkata Australia/Sydney Pacific/Kiritimati Pacific/Pago_Pago; do
            echo "TZ=$tz"
            TZ=$tz EXPECT_TZ=$tz npx jest --ci src/engine/__tests__/daily.test.ts -t "device path"
          done
      - run: npm run quotes:validate
      - run: node --test "tools/quotes/__tests__/*.test.mjs"
