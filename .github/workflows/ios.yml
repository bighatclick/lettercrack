# iOS simulator E2E build tested with Maestro on macOS. Unit checks live in ci.yml.
# Public repo: macOS minutes are free. Android stays local-only (CLAUDE.md), so nothing here builds it.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  ios-e2e:
    name: iOS simulator build + Maestro
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_E2E: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          node -v
      - run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'modules/**/*.podspec') }}

      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Build for simulator (Release, E2E hooks on)
        working-directory: ios
        run: |
          if ! xcodebuild \
            -workspace LetterCrack.xcworkspace \
            -scheme LetterCrack \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | head -50 || true
            tail -150 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/xcodebuild.log"
          test -d build/Build/Products/Release-iphonesimulator/LetterCrack.app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator and install app
        run: .github/scripts/boot-simulator.sh ios/build/Build/Products/Release-iphonesimulator/LetterCrack.app

      - name: Maestro flows
        run: maestro test e2e/ --format junit --output "$RUNNER_TEMP/maestro-report.xml" --debug-output "$RUNNER_TEMP/maestro-debug"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
