# Spec §14: onboarding → solve the daily → share → archive.
# Needs an E2E build (EXPO_PUBLIC_E2E=1) so the "e2e-solve" hook exists. Runs on Android and iOS (CI: .github/workflows/ios.yml).
appId: app.lettercrack
---
- clearState
- launchApp
# Onboarding: "A CAT". Skip the mini puzzle and pick a difficulty.
- tapOn:
    id: onboarding-skip
- tapOn:
    id: onboarding-medium
- tapOn:
    id: onboarding-start
# Home → today's daily.
- assertVisible:
    id: home-daily
- tapOn:
    id: home-daily
- assertVisible:
    id: board
- tapOn:
    id: e2e-solve
# Solved screen: quote, author card, share.
- extendedWaitUntil:
    visible:
      id: solved-quote
    timeout: 5000
# The awards and wardrobe cards can push Share below the fold.
- scrollUntilVisible:
    element:
      id: solved-share
    direction: DOWN
- tapOn:
    id: solved-share
# Dismiss the system share sheet. Wait for it first: a Back sent while it is still opening is lost.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "Sharing.*"
          timeout: 10000
          optional: true
      - back
      - runFlow:
          when:
            visible:
              text: "Sharing.*"
          commands:
            - back
# iOS has no Back: close the share sheet with its Close button, or swipe it down.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Close"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - runFlow:
          when:
            visible:
              text: "Close"
          commands:
            - swipe:
                direction: DOWN
- scrollUntilVisible:
    element:
      text: Home
    direction: DOWN
- tapOn: Home
# Archive opens (empty on launch day, so only check the screen).
# Home has goals, rank and level cards above the tiles.
- scrollUntilVisible:
    element:
      id: home-archive
    direction: DOWN
- tapOn:
    id: home-archive
- assertVisible: Archive
