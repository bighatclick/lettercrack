# From Home: opens the next level.
appId: app.lettercrack
---
- scrollUntilVisible:
    element:
      id: home-level
    direction: DOWN
    timeout: 20000
- tapOn:
    id: home-level
- extendedWaitUntil:
    # At the largest text on a small iPhone the board can sit above the fold; the hint bar shows.
    visible:
      id: "(board|hint-reveal)"
    timeout: 10000
