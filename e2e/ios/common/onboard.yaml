# Skips the tutorial and picks a default difficulty. Ends on Home.
# env: DIFF (easy | medium | hard | expert)
appId: app.lettercrack
---
- tapOn:
    id: onboarding-skip
# At the largest text sizes the picker scrolls.
- scrollUntilVisible:
    element:
      id: onboarding-${DIFF}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: onboarding-${DIFF}
- scrollUntilVisible:
    element:
      id: onboarding-start
    direction: DOWN
    timeout: 20000
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: home-settings
    timeout: 15000
