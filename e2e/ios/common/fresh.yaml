# A fresh install with the test clock at AT. Ends on onboarding.
# env: AT ("2027-01-10T10:00:00"), NOTIFY (allow | deny | unset: the notification permission)
appId: app.lettercrack
---
- clearState
- launchApp:
    permissions:
      notifications: ${NOTIFY}
# The first launch already loaded an empty save on the real date: wipe it, set the clock, relaunch,
# so the install day (archive start, stamp book) is the test date.
- runFlow:
    file: e2e-link.yaml
    env:
      QUERY: "fresh=1&at=${AT}"
- runFlow: restart.yaml
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    # The iPad simulator renders in software on CI; its first launch after a wipe can take ~50 s.
    timeout: 90000
