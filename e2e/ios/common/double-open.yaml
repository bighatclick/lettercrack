# From Home: double-taps the tile with id ID, waits for MARK (a regex on the screen it opens),
# then taps Back once and checks Home is showing: the second tap didn't open the screen again.
# env: ID, MARK
appId: app.lettercrack
---
- runFlow: top.yaml
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: UP
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    timeout: 45000
- doubleTapOn:
    id: ${ID}
- extendedWaitUntil:
    visible: ${MARK}
    timeout: 10000
# The push animation must be over, or the Back tap can be dropped on a slow simulator.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: back.yaml
- extendedWaitUntil:
    visible:
      id: home-settings
    timeout: 10000
# Home has no Back button: one Back left the only copy of the screen.
- assertNotVisible: "Back"
