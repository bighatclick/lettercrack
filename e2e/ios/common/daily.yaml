# From Home: opens today's daily (it must be unsolved).
appId: app.lettercrack
---
- runFlow: top.yaml
# At the largest text sizes the Today card's button is below the fold.
- scrollUntilVisible:
    element:
      id: home-daily
    direction: DOWN
    timeout: 20000
- tapOn:
    id: home-daily
- extendedWaitUntil:
    visible:
      id: board
    timeout: 10000
