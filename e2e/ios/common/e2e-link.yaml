# Opens a lettercrack://e2e?… set-up link (app/e2e.tsx) and waits until it is applied.
# env: QUERY (the part after "?", e.g. "at=2027-01-10T10:00:00")
appId: app.lettercrack
---
# Right after a wipe the simulator can time out opening the link (NSPOSIXErrorDomain 60) even
# though the app gets it, or the app may still be starting and miss it. `optional` doesn't catch
# that error, so the whole step is retried; the set-up links are safe to apply twice.
- retry:
    maxRetries: 3
    commands:
      - openLink: "lettercrack://e2e?${QUERY}"
      # iOS may ask before opening a custom-scheme link.
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible:
            id: e2e-ok
          timeout: 20000
