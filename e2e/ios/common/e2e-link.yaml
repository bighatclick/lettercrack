# Opens a lettercrack://e2e?… set-up link (app/e2e.tsx) and waits until it is applied.
# env: QUERY (the part after "?", e.g. "at=2027-01-10T10:00:00")
appId: app.lettercrack
---
# The simulator can time out opening the link right after a wipe (NSPOSIXErrorDomain 60): retried below.
- openLink:
    link: "lettercrack://e2e?${QUERY}"
    optional: true
# iOS may ask before opening a custom-scheme link.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: e2e-ok
    timeout: 15000
    optional: true
# Right after a wipe the app may still be starting and miss the link (seen on CI): send it again.
- runFlow:
    when:
      notVisible:
        id: e2e-ok
    commands:
      - openLink: "lettercrack://e2e?${QUERY}"
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: e2e-ok
    timeout: 30000
