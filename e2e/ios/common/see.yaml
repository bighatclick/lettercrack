# Asserts TEXT (a regex, full match) is on the current screen, scrolling down to it if needed.
# env: TEXT
appId: app.lettercrack
---
- scrollUntilVisible:
    element:
      text: ${TEXT}
    direction: DOWN
    # Long screens at the largest text sizes take many slow scrolls on the CI simulator.
    timeout: 45000
    visibilityPercentage: 50
