# J1 1.10–1.11: the greeting follows the time of day; a relaunch opens straight on Home.
appId: app.lettercrack
tags: [onboarding]
---
- runFlow:
    file: ../common/start.yaml
    env:
      AT: "2027-01-10T11:00:00"
      DIFF: medium
      NOTIFY: unset
- assertVisible: "Good morning, codebreaker!"
- runFlow:
    file: ../common/clock.yaml
    env:
      AT: "2027-01-10T14:00:00"
- assertVisible: "Good afternoon, codebreaker!"
- runFlow:
    file: ../common/clock.yaml
    env:
      AT: "2027-01-10T19:00:00"
- assertVisible: "Good evening, codebreaker!"
# The greeting changes on the hour with the app open (no restart).
- runFlow:
    file: ../common/clock.yaml
    env:
      # 90 s before 6pm: setting the clock restarts the app, which can take 30 s or more on CI.
      AT: "2027-01-10T17:58:30"
- assertVisible: "Good afternoon, codebreaker!"
- extendedWaitUntil:
    visible: "Good evening, codebreaker!"
    timeout: 120000
# 1.11: kill and relaunch: straight to Home, no onboarding.
- runFlow:
    file: ../common/clock.yaml
    env:
      AT: "2027-01-10T10:00:00"
- assertVisible:
    id: home-settings
- assertNotVisible:
    id: onboarding-skip
- assertVisible: "Good morning, codebreaker!"
