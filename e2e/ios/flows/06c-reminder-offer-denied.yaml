# J12 12.10–12.11: notifications denied: "Remind me" explains how to turn them on, the toggle stays
# off (and snaps back if tapped), and the offer doesn't come back.
appId: app.lettercrack
tags: [reminder]
---
- runFlow:
    file: ../common/start.yaml
    env:
      AT: "2027-01-10T10:00:00"
      DIFF: medium
      NOTIFY: unset
- runFlow: ../common/solve-daily.yaml
- runFlow:
    file: ../common/daily-on.yaml
    env:
      AT: "2027-01-11T10:00:00"
- runFlow:
    file: ../common/see.yaml
    env:
      TEXT: "Remind me"
- tapOn: "Remind me"
# The system prompt: deny.
- extendedWaitUntil:
    visible: "(?i).*would like to send you notifications.*"
    timeout: 10000
- tapOn: "Don.t Allow"
- extendedWaitUntil:
    visible: "Notifications are off for LetterCrack\\. You can turn them on in your device settings\\."
    timeout: 5000
- tapOn: "OK"
- assertNotVisible: "Want a nudge tomorrow\\?"
- runFlow: ../common/home.yaml
- tapOn:
    id: home-settings
- assertVisible:
    id: setting-reminder
    checked: false
# 12.10: turning it on while notifications are denied snaps back to off.
- tapOn:
    id: setting-reminder
- assertVisible:
    id: setting-reminder
    checked: false
- runFlow: ../common/back.yaml
# The offer never comes back.
- runFlow:
    file: ../common/daily-on.yaml
    env:
      AT: "2027-01-12T10:00:00"
- runFlow:
    file: ../common/see.yaml
    env:
      TEXT: "Home"
- assertNotVisible: "Want a nudge tomorrow\\?"
